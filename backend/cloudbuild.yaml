# Cloud Build pipeline: test, then deploy the functions and API Gateway.
#
# Run manually:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_LOCATION=us-central1,_BUCKET=my-bucket,_KMS_KEY_RING=certificate-signing,\
#_KMS_KEY_NAME=certificate-signer,_KMS_KEY_VERSION=1,_BASE_URL=https://certificates.example.com/verify,\
#_ADMIN_EMAILS=admin@example.com,_ENVIRONMENT=production
#
# The Cloud Build service account needs permission to deploy Cloud Run functions, act as the
# runtime service accounts and manage API Gateway (see README, "Deploying with Cloud Build").
substitutions:
  _LOCATION: us-central1
  _GATEWAY_LOCATION: us-central1
  _BUCKET: ""
  _KMS_KEY_RING: certificate-signing
  _KMS_KEY_NAME: certificate-signer
  _KMS_KEY_VERSION: "1"
  _BASE_URL: ""
  _ADMIN_EMAILS: ""
  _CORS_ORIGINS: ""
  _ENVIRONMENT: production

steps:
  - id: unit-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements-dev.txt
        python -m pytest

  - id: deploy-functions
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args: ["scripts/deploy_functions.sh"]
    env:
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - IDENTITY_PLATFORM_PROJECT_ID=$PROJECT_ID
      - GOOGLE_CLOUD_LOCATION=${_LOCATION}
      - GCS_BUCKET_NAME=${_BUCKET}
      - KMS_KEY_RING=${_KMS_KEY_RING}
      - KMS_KEY_NAME=${_KMS_KEY_NAME}
      - KMS_KEY_VERSION=${_KMS_KEY_VERSION}
      - PUBLIC_VERIFICATION_BASE_URL=${_BASE_URL}
      - ADMIN_EMAILS=${_ADMIN_EMAILS}
      - CORS_ALLOWED_ORIGINS=${_CORS_ORIGINS}
      - ENVIRONMENT=${_ENVIRONMENT}

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args: ["scripts/deploy_api.sh"]
    env:
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - IDENTITY_PLATFORM_PROJECT_ID=$PROJECT_ID
      - GOOGLE_CLOUD_LOCATION=${_LOCATION}
      - GATEWAY_LOCATION=${_GATEWAY_LOCATION}

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3000s
